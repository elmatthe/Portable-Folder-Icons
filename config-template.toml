# ============================================================================
# Project Configuration
# ============================================================================
# This file is intended to be copied and customized for each repository.
#
# Format: TOML
# https://toml.io/
#
# Keep comments where possible—they act as documentation for future AI agents
# and developers.
# ============================================================================

[project]
name = "[PROJECT_NAME]"
display_name = "[Project Name]"
version = "0.1.0"
description = ""
author = ""
license = "MIT"

[paths]
scripts = "scripts"
files = "files"
tests = "files/tests"
logs = "files/logs"
test_logs = "files/test-logs"
temp = "files/temp"
output = "files/output"

[platform]
windows = true
macos = true
linux = false

[python]
minimum_version = "3.11"
virtual_environment = ".venv"
entry_point = "scripts/launcher.py"

[logging]
enabled = true
level = "INFO"
write_to_file = true
console_output = true
log_directory = "files/logs"

[features]
gui = true
cli = false
auto_update = false
telemetry = false

[verification]
require_pytest = true
require_pinned_dependencies = true
require_changelog = true
require_briefing = true

[release]
create_git_tag = true
generate_release_notes = true
run_verify_before_release = true

[developer]
workspace = "AI-WORKSPACE.md"
briefing = "md-instructions/Briefing.md"
changelog = "md-instructions/Changelog.md"
decisions = "md-instructions/Decisions.md"
handoff = "md-instructions/Handoff.md"

[custom]
# Add project-specific settings below.